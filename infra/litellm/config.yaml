model_list:
  - model_name: assistant-supervisor
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: assistant-specialist
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2

general_settings:
  # Local development only: the proxy is bound to 127.0.0.1 in compose.yaml.
  dangerously_permit_weak_or_unset_master_key: true
